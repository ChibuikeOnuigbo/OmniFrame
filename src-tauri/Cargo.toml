[package]
name = "omniframe"
version = "0.1.0"
description = "OmniFrame cross-platform non-linear video editor"
authors = ["OmniFrame contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "omniframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
