[package]
name = "omniframe-desktop"
version = "0.1.0"
description = "OmniFrame Tauri 2 desktop shell"
authors = ["OmniFrame contributors"]
edition = "2021"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omniframe-core = { path = "../../../crates/omniframe-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
